services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: shopfloor
      POSTGRES_USER: shopfloor
      POSTGRES_PASSWORD: shopfloor
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopfloor -d shopfloor"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/ShopFloor.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__ShopFloor: Host=postgres;Port=5432;Database=shopfloor;Username=shopfloor;Password=shopfloor
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
